    .orb-ring-outer { width: 160px; height: 160px; }
    .orb-ring-mid { width: 126px; height: 126px; }
    .orb-ring-inner { width: 94px; height: 94px; }
    .orb-glow { width: 88px; height: 88px; }
    .orb-core { width: 66px; height: 66px; }
    .orb-core::after { top: 8px; left: 10px; width: 18px; height: 12px; }

    /* Text */
    .status-label { font-size: 18px; }

    /* Begin Journey button */

    .toggle-label { font-size: 10px; }

    .logo img { width: 110px; height: 110px; }
    .status-label { font-size: 16px; }
  }

  .quiet-banner-text strong{
    font-weight:600;
    color:rgba(30,10,2,.92);
  }
  .quiet-banner-dismiss{
    margin-left:auto;
    background:none;
    border:none;
    cursor:pointer;
    color:rgba(60,25,5,.5);
    font-size:16px;
    flex-shrink:0;
    padding:0 0 0 8px;
    line-height:1;
    transition:color .2s;
  }
  .quiet-banner-dismiss:hover{
    color:rgba(40,15,2,.85);
  }
  @media (max-width:480px){
    .quiet-banner{ padding:10px 16px; }
    .quiet-banner-text{ font-size:11px; }
  }
</style>
</head>
<body>
<div class="scene"></div>
<div class="scene-overlay"></div>
<div class="grain"></div>
<div class="light-halo"></div>
<div class="horizon-glow"></div>
<div class="app">
  <div class="header">
    <a href="https://www.utahreia.org/" target="_blank" rel="noopener noreferrer" class="logo"><img src="https://assets.cdn.filesafe.space/DNirEjy0ejVwbHsaBYrn/media/682f680ec314718407baed82.png" alt="Utah REIA" /></a>
    <a href="https://www.utahreia.org/" target="_blank" rel="noopener noreferrer" style="text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px;">
      <h1 style="font-size:18px;font-weight:600;color:rgba(30,10,2,.88);letter-spacing:1.5px;text-transform:uppercase;">Utah REIA Voice Agent</h1>
      <p style="font-size:11px;color:rgba(60,25,5,.6);letter-spacing:3px;text-transform:uppercase;">Real-time conversation</p>
    </a>
    <div class="call-timer" id="callTimer"><span class="dot"></span><span id="timerText">00:00</span></div>
  </div>
  <div class="error-banner" id="errorBanner"></div>
  <div class="setup-screen" id="setupScreen">
    <div class="orb-stage" id="setupOrb">
      <div class="orb-ring-outer"></div><div class="orb-ring-mid"></div><div class="orb-ring-inner"></div><div class="orb-glow"></div><div class="orb-core"></div>
    </div>
    <div class="status-label">Begin your journey</div>
    <div class="setup-sub">Tell us where you are. We'll point you to the right people, tools, and next step.</div>
    <div style="width:100%;max-width:320px;margin:12px auto 0;">
      <input type="tel" id="preCallPhone" placeholder="Your phone number (optional)"
        style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(120,60,10,.25);background:rgba(255,245,230,.6);font-size:14px;font-family:'DM Sans',sans-serif;color:rgba(30,10,2,.85);outline:none;box-sizing:border-box;text-align:center;"
        inputmode="tel" autocomplete="tel"
      />
      <div id="memberGreeting" style="display:none;margin-top:8px;padding:10px 14px;border-radius:10px;background:rgba(40,140,30,.1);border:1px solid rgba(40,140,30,.25);font-size:13px;color:rgba(20,80,10,.9);font-family:'DM Sans',sans-serif;text-align:center;line-height:1.5;"></div>
    </div>
    <div class="quiet-banner" id="quietBanner">
      <span class="quiet-banner-icon">&#127897;</span>
      <span class="quiet-banner-text"><strong>Find a quiet spot first.</strong> Background noise cuts off the conversation.</span>
      <button class="quiet-banner-dismiss" id="quietDismiss" aria-label="Dismiss">&#215;</button>
    </div>
    <button class="start-btn" id="startBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/>
      </svg>
      Begin Journey
    </button>
  </div>
  <div class="call-screen" id="callScreen">
    <div class="call-orb-area">
      <div class="orb-stage" id="callOrb">
        <div class="orb-ring-outer"></div><div class="orb-ring-mid"></div><div class="orb-ring-inner"></div><div class="orb-glow"></div><div class="orb-core"></div>
      </div>
      <div class="status-label" id="statusLabel">Connecting...</div>
      <div class="transcript-area" id="transcriptArea"></div>
    </div>


    <div class="call-controls">
      <div class="status-indicator" id="statusInd"><div class="voice-bars"><span></span><span></span><span></span><span></span><span></span></div><span id="statusText">Connecting...</span></div>
      <div class="btn-row">
        <button class="end-btn" id="endBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/>
            <line x1="23" y1="1" x2="1" y2="23"/>
          </svg>
          End Call
        </button>
        <button class="toggle-btn" id="toggleBtn">
          <div class="eye-icon"><div class="eye-oval"></div><div class="eye-pupil" id="eyePupil"></div><div class="eye-slash" id="eyeSlash"></div></div>
          <span class="toggle-label" id="toggleLabel">Text</span>
        </button>
      </div>
      <div class="hint-bar">Just talk naturally. Pause when you're done.</div>
    </div>
  </div>
  <div class="debug-log" id="debugLog"></div>
</div>
<script>
const VAPI_PUBLIC_KEY  = 'fdd43a99-3ec4-4eab-ba03-d83d99e2f94d';
const VAPI_ASSISTANT_ID = '92018c4f-f382-41b9-80e0-c46e8f2b505a';
const GHL_WEBHOOK = 'https://services.leadconnectorhq.com/hooks/DNirEjy0ejVwbHsaBYrn/webhook-trigger/d0a34baf-4e42-4a96-8f77-e6b99df93060';

// DOM refs
const setupScreen   = document.getElementById('setupScreen');
const callScreen    = document.getElementById('callScreen');
const startBtn      = document.getElementById('startBtn');
const endBtn        = document.getElementById('endBtn');
const transcriptArea= document.getElementById('transcriptArea');
const statusInd     = document.getElementById('statusInd');
const statusText    = document.getElementById('statusText');
const callTimer     = document.getElementById('callTimer');
const timerText     = document.getElementById('timerText');
const errorBanner   = document.getElementById('errorBanner');
const debugLog      = document.getElementById('debugLog');
// Form removed - contact details collected verbally
const callOrb       = document.getElementById('callOrb');
const statusLabel   = document.getElementById('statusLabel');
const toggleBtn     = document.getElementById('toggleBtn');
const toggleLabel   = document.getElementById('toggleLabel');

// State
let callerName  = '';
let callerEmail = '';
let callerPhone = '';
let callActive  = false;
let timerInterval = null;
let callStartTime = 0;
let transcriptVisible = false;
let vapi = null;

function log(msg) {
  debugLog.classList.add('show');
  const div = document.createElement('div');
  div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  debugLog.appendChild(div);
  debugLog.scrollTop = debugLog.scrollHeight;
  console.log('[REIA]', msg);
}

function showError(msg) {
  errorBanner.textContent = msg;
  errorBanner.classList.add('show');
  setTimeout(() => errorBanner.classList.remove('show'), 8000);
}

function setStatus(state, text) {
  statusInd.className = 'status-indicator ' + state;
  statusText.textContent = text;
  if (callOrb) callOrb.className = 'orb-stage ' + state;
  const labels = {
    listening: 'Listening...',
    thinking:  'Thinking...',
    speaking:  'Speaking'
  };
  if (statusLabel) statusLabel.textContent = text || labels[state] || text;
}

function updateTimer() {
  const secs = Math.floor((Date.now() - callStartTime) / 1000);
  const m = String(Math.floor(secs / 60)).padStart(2, '0');
  const s = String(secs % 60).padStart(2, '0');
  timerText.textContent = m + ':' + s;
}

function addMessage(role, text) {
  const msg = document.createElement('div');
  msg.className = 'msg ' + (role === 'assistant' ? 'ai' : 'user');
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'assistant' ? 'R' : 'U';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  msg.appendChild(av);
  msg.appendChild(bubble);
  transcriptArea.appendChild(msg);
  transcriptArea.scrollTop = transcriptArea.scrollHeight;
}

async function loadVapiSDK() {
  if (window.Vapi) return;

  const urls = [
    'https://cdn.jsdelivr.net/gh/balacodeio/Vapi-Web-UMD@2.1.0/dist/2.1.0/vapi-web-bundle-2.1.0.min.js',
    'https://cdn.jsdelivr.net/npm/@vapi-ai/web@2.1.0/dist/vapi.umd.js',
    'https://cdn.jsdelivr.net/npm/@vapi-ai/web@2.0.0/dist/vapi.umd.js',
    'https://cdn.jsdelivr.net/npm/@vapi-ai/web@1.0.0/dist/vapi.umd.js',
  ];

  for (const url of urls) {
    try {
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        script.onload = () => {
          log('SDK loaded from: ' + url);
          resolve();
        };
        script.onerror = () => reject(new Error('Failed: ' + url));
        document.head.appendChild(script);
      });
      if (window.Vapi) { log('Vapi class ready', 'ok'); return; }
    } catch(e) {
      log('Trying next CDN...');
    }
  }
  throw new Error('All CDN sources failed - Vapi could not be loaded');
}

function initVapi() {
  if (vapi) return;
  if (typeof window.Vapi === 'undefined') {
    showError('Vapi SDK failed to load. Please refresh the page.');
    throw new Error('Vapi is not defined');
  }
  vapi = new window.Vapi(VAPI_PUBLIC_KEY);

  vapi.on('call-start', () => {
    log('Vapi call started');
    callActive = true;
    setStatus('speaking', 'Speaking');
  });

  vapi.on('call-end', () => {
    log('Vapi call ended');
    callActive = false;
    endCallCleanup();
  });

  vapi.on('speech-start', () => {
    setStatus('speaking', 'Speaking');
  });

  vapi.on('speech-end', () => {
    setStatus('listening', 'Listening...');
  });

  vapi.on('message', (msg) => {
    if (msg.type === 'transcript') {
      if (msg.role === 'user' && msg.transcriptType === 'final') {
        addMessage('user', msg.transcript);
      }
      if (msg.role === 'assistant' && msg.transcriptType === 'final') {
        addMessage('assistant', msg.transcript);
      }
    }

    // Show thinking state when tool calls are in progress
    if (msg.type === 'tool-calls' || msg.type === 'tool-call-result') {
      const toolName = msg.toolCallList?.[0]?.function?.name || msg.toolCalls?.[0]?.function?.name || '';
      if (toolName === 'getMemberProfile') {
        setStatus('thinking', 'Finding your profile...');
      } else {
        setStatus('thinking', 'Finding resources...');
      }
    }

    // Return to speaking when tool result is processed
    if (msg.type === 'tool-call-result') {
      setTimeout(() => {
        if (callActive) setStatus('speaking', 'Speaking');
      }, 300);
    }
  });

  vapi.on('error', (e) => {
    log('Vapi error: ' + (e.message || JSON.stringify(e)));
    showError('Call error - please try again.');
    endCallCleanup();
  });
}

async function startCall() {
  try {
    await loadVapiSDK();
    initVapi();

    callStartTime = Date.now();
    callTimer.classList.add('active');
    timerInterval = setInterval(updateTimer, 1000);
    updateTimer();

    setupScreen.classList.add('hidden');
    callScreen.classList.add('active');

    setStatus('thinking', 'Connecting...');
    if (statusLabel) statusLabel.textContent = 'Connecting...';

    // Fetch live context from Supabase before starting the call
    let contextBlock = '';
    try {
      const ctxResp = await fetch('/api/context', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({})
      });
      if (ctxResp.ok) {
        const ctxData = await ctxResp.json();
        contextBlock = ctxData.result || '';
        log('Live context loaded', 'ok');
      }
    } catch(e) {
      log('Context fetch failed - using fallback: ' + e.message);
    }

    // Pre-call member lookup using phone number if provided
    let memberProfileBlock = '';
    const preCallPhoneInput = document.getElementById('preCallPhone');
    const preCallPhone = preCallPhoneInput ? preCallPhoneInput.value.trim() : '';
    if (preCallPhone) {
      try {
        const memberResp = await fetch('/api/member-lookup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: preCallPhone })
        });
        if (memberResp.ok) {
          const memberData = await memberResp.json();
          if (memberData.result && !memberData.result.startsWith('not_found') && !memberData.result.startsWith('No phone') && !memberData.result.startsWith('Exception')) {
            memberProfileBlock = 'RETURNING MEMBER PROFILE:\n' + memberData.result;
            log('Member profile loaded for: ' + preCallPhone, 'ok');
          } else {
            memberProfileBlock = 'MEMBER LOOKUP: No profile found for this phone number. Proceed with normal intake.';
            log('Member not found for: ' + preCallPhone);
          }
        }
      } catch(e) {
        log('Member lookup failed: ' + e.message);
      }
    } else {
      memberProfileBlock = 'MEMBER LOOKUP: No phone provided before call. Collect phone number during intake.';
    }

    // Inject context into Vapi as a system message override
    const overrides = {
      variableValues: {
        callerName: callerName || '',
        callerEmail: callerEmail || '',
        callerPhone: callerPhone || ''
      }
    };

    // Pass context as a variable so Vapi injects it into the conversation
    if (contextBlock) {
      overrides.variableValues.liveContext = contextBlock + (memberProfileBlock ? '\n\n' + memberProfileBlock : '');
    }

    await vapi.start(VAPI_ASSISTANT_ID, overrides);
    log('Vapi started');

  } catch(e) {
    log('Start error: ' + e.message);
    showError('Could not start call: ' + e.message);
    endCallCleanup();
  }
}

function endCall() {
  if (vapi && callActive) {
    vapi.stop();
  }
  syncToGHL();
  endCallCleanup();
}

function endCallCleanup() {
  callActive = false;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  callTimer.classList.remove('active');
  callScreen.classList.remove('active');
  setupScreen.classList.remove('hidden');
  transcriptArea.innerHTML = '';
  callerName = ''; callerEmail = ''; callerPhone = '';

  if (statusLabel) statusLabel.textContent = 'Begin your journey';
  log('Call ended');
}

async function syncToGHL() {
  if (!callerEmail && !callerPhone) return;
  try {
    const payload = {
      first_name: callerName.split(' ')[0] || callerName,
      last_name: callerName.split(' ').slice(1).join(' ') || '',
      email: callerEmail,
      phone: callerPhone,
      tags: ['Voice Agent Lead']
    };
    await fetch(GHL_WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    log('GHL sync sent');
  } catch(e) {
    log('GHL sync error: ' + e.message);
  }
}

// Event listeners
startBtn.addEventListener('click', startCall);

// Pre-call phone lookup — check member when they leave the phone field
const preCallPhoneInput = document.getElementById('preCallPhone');
const memberGreeting = document.getElementById('memberGreeting');
if (preCallPhoneInput) {
  preCallPhoneInput.addEventListener('blur', async () => {
    const phone = preCallPhoneInput.value.trim();
    if (phone.replace(/\D/g, '').length >= 10) {
      try {
        const resp = await fetch('/api/member-lookup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone })
        });
        if (resp.ok) {
          const data = await resp.json();
          if (data.result && !data.result.startsWith('not_found') && !data.result.startsWith('No phone') && !data.result.startsWith('Exception')) {
            memberGreeting.textContent = data.result.split('.')[0] + '.';
            memberGreeting.style.display = 'block';
          }
        }
      } catch(e) {}
    }
  });
}
endBtn.addEventListener('click', endCall);

toggleBtn.addEventListener('click', () => {
  transcriptVisible = !transcriptVisible;
  document.getElementById('transcriptArea').classList.toggle('visible', transcriptVisible);
  toggleLabel.textContent = transcriptVisible ? 'Hide' : 'Text';
  document.getElementById('eyeSlash').style.display = transcriptVisible ? 'block' : 'none';
  document.getElementById('eyePupil').style.display = transcriptVisible ? 'none' : 'block';
});

// Contact details collected verbally via Vapi conversation

// Quiet environment banner dismiss
const quietBanner = document.getElementById('quietBanner');
const quietDismiss = document.getElementById('quietDismiss');
if (quietDismiss) {
  quietDismiss.addEventListener('click', () => {
    quietBanner.style.opacity = '0';
    quietBanner.style.transition = 'opacity .3s';
    setTimeout(() => { quietBanner.style.display = 'none'; }, 300);
  });
}

log('App loaded. Ready.');
log('Origin: ' + window.location.origin);
</script>
</body>
</html>
