name: Health — ElevenLabs voice key

# Voice-layer watchdog. Pings /api/health-elevenlabs, which checks the ElevenLabs
# key Vapi (Lani) depends on. Born from the 2026-08-06 outage that took ~2h to
# diagnose because nothing watched the voice layer. Runs every 15 minutes here
# (NOT a Vercel cron — Vercel Hobby crons run at most once a day).
#
# ALERTING: a failed run of this workflow emails the repo admins by default — that
# is the alarm. Add an optional repo secret SLACK_WEBHOOK_URL to also post to Slack.
#
# SETUP (until both are done, the job runs green as "setup pending", never alarms):
#   1. Vercel env  ELEVENLABS_API_KEY = the EXACT key configured in Vapi's voice
#      provider (see api/health-elevenlabs.js header).
#   2. Repo secret HEALTHCHECK_TOKEN  = identical to Vercel env HEALTHCHECK_TOKEN
#      (only needed if you gate the endpoint; leave both unset to run it open).

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min (GitHub best-effort; may lag under load)
  workflow_dispatch: {}

jobs:
  probe:
    name: Probe ElevenLabs voice key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          URL="https://voice-agent-ai-nu.vercel.app/api/health-elevenlabs"
          AUTH=()
          if [ -n "$HEALTHCHECK_TOKEN" ]; then
            AUTH=(-H "Authorization: Bearer ${HEALTHCHECK_TOKEN}")
          fi

          RESP=$(curl -s --max-time 20 "${AUTH[@]}" "$URL")
          echo "Response: ${RESP}"

          OK=$(echo "$RESP" | jq -r '.ok // false')
          CONFIGURED=$(echo "$RESP" | jq -r '.configured // false')

          if [ "$OK" = "true" ]; then
            TIER=$(echo "$RESP" | jq -r '.tier // "unknown"')
            echo "ElevenLabs voice key healthy (tier: ${TIER})."
            exit 0
          fi

          # Not wired up yet — a warning, not an outage. Do not alarm.
          if [ "$CONFIGURED" = "false" ]; then
            echo "::warning::ElevenLabs health probe not configured yet."
            echo "Set Vercel env ELEVENLABS_API_KEY to the key Vapi uses, then this begins guarding the voice layer."
            exit 0
          fi

          # Real failure: the key Vapi depends on is unhealthy.
          ERR=$(echo "$RESP" | jq -r '.error // "unknown"')
          HTTP=$(echo "$RESP" | jq -r '.http_status // "n/a"')
          echo "::error::ElevenLabs voice key UNHEALTHY — error=${ERR} http_status=${HTTP}. Lani's voice may be down. Rotate/replace the key in Vapi (and HeyGen)."

          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s --max-time 15 -X POST -H 'Content-Type: application/json' \
              -d "{\"text\":\":rotating_light: Lani voice-layer health check FAILED — ElevenLabs key unhealthy (error=${ERR}, http=${HTTP}). Check Vapi/HeyGen credentials.\"}" \
              "$SLACK_WEBHOOK_URL" >/dev/null || echo "Slack notify failed (non-fatal)."
          fi

          exit 1
